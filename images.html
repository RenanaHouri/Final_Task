<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="images.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=help,keyboard_arrow_down">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Isometra&family=Karla:ital,wght@0,200..800;1,200..800&family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body class="images-page">
    <header>
    <a href="index.html" class="logo">
        <img src="chatgpt-icon.webp" alt="ChatGPT logo">
        <span>ChatGPT</span>
        <span class="material-symbols-outlined">
            keyboard_arrow_down
        </span>
    </a>

    <section class="user-button">
        <button type="button" class="login">Log in</button>
        <button type="button" class="sign-up">Sign up for free</button>
        <button type="button" class="help">
            <span class="material-symbols-outlined">help</span>
        </button>
    </section>
</header>

<main>
    <h1>Images</h1>
    <section class="styles">
         <h2>Try a style on an image</h2>
          <div class="arrows">
            <button type="button" class="arrows1"><</button>
            <button type="button" >></button>
        </div>
        
          <div class="img-container">
            <figure>
                <img src="image2.jpeg" alt="Sketch style">
                <figcaption>Sketch</figcaption>
            </figure>
            <figure>
                <img src="image7.jpeg" alt="Dramatic style">
                <figcaption>Dramatic</figcaption>
            </figure>
            <figure>
                <img src="image6.jpeg" alt="Plushie style">
                <figcaption>Plushie</figcaption>
            </figure>
            <figure>
                 <img src="image5.jpeg" alt="Retro anime style">
                 <figcaption>Retro anime</figcaption>
            </figure>
            <figure>
                 <img src="image4.jpeg" alt="Baseball bobblehead">
                 <figcaption>Baseball bobblehead</figcaption>
            </figure>
            <figure>
                 <img src="image3.jpeg" alt="Doodle">
                 <figcaption>Doodle</figcaption>
            </figure>
          </div>
          
    </section>

    <section class="discover">
        <h2>Discover something new</h2>
         <div class="arrows-down">
            <button type="button" class="arrows2"><</button>
            <button type="button" >></button>
        </div>
        <div class="img-container-dowen">
            <figure>
            <img src="image8.jpeg" alt="Me as The Girl with a Pearl">
            <p>Me as The Girl with a Pearl</p>
        </figure>
        <figure>
            <img src="image11.jpeg" alt="Create a professional product photo">
            <p>Create a professional product photo</p>
        </figure>
        <figure>
            <img src="image9.jpeg" alt="Remove people in the background">
            <p>Remove people in the background</p>
        </figure>
        <figure>
            <img src="image12.jpeg" alt="Style me">
            <p>Style me</p>
        </figure>
        <figure>
            <img src="image10.jpeg" alt="What would I look like as a K-Pop star?">
            <p>What would I look like as a K-Pop star?</p>
        </figure>
        <figure>
            <img src="image13.jpeg" alt="Turn into a keychain">
            <p>Turn into a keychain</p>
        </figure>
        </div>
    </section>
</main>
</body>
</html>
